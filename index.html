<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신나는 두더지 잡기 게임</title>
  <style>
    /* 기본 스타일 및 배치가 세팅된 CSS */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f9ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .info-board {
      display: flex;
      gap: 30px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 20px;
    }

    .info-board span {
      color: #e74c3c;
    }

    /* 게임판 및 구멍 스타일 */
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 15px;
      background-color: #8b5a2b;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .hole {
      width: 110px;
      height: 110px;
      background-color: #3e2723;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 10px 10px rgba(0,0,0,0.5);
    }

    /* 두더지 캐릭터 */
    .mole {
      width: 80px;
      height: 80px;
      background-color: #a0522d;
      border-radius: 50% 50% 40% 40%;
      position: absolute;
      bottom: -90px; /* 초기에는 구멍 밑에 숨어있음 */
      left: 15px;
      transition: bottom 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 두더지 얼굴 요소 */
    .mole::before {
      /* 눈 */
      content: '';
      width: 10px;
      height: 10px;
      background-color: black;
      border-radius: 50%;
      box-shadow: 25px 0 0 black;
      margin-bottom: 5px;
    }

    .mole::after {
      /* 코 */
      content: '';
      width: 14px;
      height: 10px;
      background-color: #ff8a80;
      border-radius: 50%;
    }

    /* 두더지가 튀어나오는 클래스 */
    .hole.up .mole {
      bottom: 10px;
    }

    /* 잡혔을 때 애니메이션 */
    .hole.hit .mole {
      background-color: #e74c3c;
    }

    /* 버튼 스타일 */
    .start-btn {
      margin-top: 25px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background-color: #2ecc71;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s, transform 0.1s;
    }

    .start-btn:hover {
      background-color: #27ae60;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .start-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>🔨 두더지 잡기 게임</h1>
  
  <div class="info-board">
    <div>점수: <span id="score">0</span>점</div>
    <div>남은 시간: <span id="time">15</span>초</div>
  </div>

  <div class="game-board">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startGame()">게임 시작</button>

  <script>
    // 게임 관련 자바스크립트 로직
    const holes = document.querySelectorAll('.hole');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let gameTime = 15; // 제한시간 (15초)
    let timer;

    // 랜덤한 시간(두더지가 올라와 있는 시간)을 생성하는 함수
    function randomTime(min, max) {
      return Math.round(Math.random() * (max - min) + min);
    }

    // 랜덤한 구멍을 선택하는 함수 (이전과 연속으로 같은 구멍 나오지 않게 처리)
    function randomHole(holes) {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) {
        return randomHole(holes);
      }
      lastHole = hole;
      return hole;
    }

    // 두더지를 튀어나오게 하는 함수
    function peep() {
      const time = randomTime(500, 1000); // 0.5초 ~ 1초 간격
      const hole = randomHole(holes);
      hole.classList.add('up');

      setTimeout(() => {
        hole.classList.remove('up');
        hole.classList.remove('hit'); // 잡힌 효과 초기화
        if (!timeUp) peep();
      }, time);
    }

    // 게임 시작 함수
    function startGame() {
      // 초기화
      scoreDisplay.textContent = 0;
      timeDisplay.textContent = gameTime;
      score = 0;
      timeUp = false;
      startBtn.disabled = true;

      peep();

      // 카운트다운 타이머 설정
      let timeLeft = gameTime;
      timer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timeUp = true;
          startBtn.disabled = false;
          alert(`게임 종료! 최종 점수는 ${score}점입니다! 🎉`);
        }
      }, 1000);
    }

    // 두더지 클릭(잡기) 이벤트 처리
    function bonk(e) {
      if (!e.isTrusted) return; // 자바스크립트 조작 방지
      const hole = this.parentNode;

      // 두더지가 올려와 있고, 아직 때리지 않은 상태인 경우
      if (hole.classList.contains('up') && !hole.classList.contains('hit')) {
        score += 10;
        hole.classList.add('hit'); // 때렸을 때 효과 추가
        scoreDisplay.textContent = score;
      }
    }

    // 모든 두더지 엘리먼트에 클릭 이벤트 추가
    document.querySelectorAll('.mole').forEach(mole => mole.addEventListener('click', bonk));
  </script>
</body>
</html>
